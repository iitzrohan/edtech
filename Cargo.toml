[workspace]
members = [
    "apps/cell-api",
    "apps/cell-worker",
    "apps/db-migrator",
    "apps/platform-api",
    "apps/platform-worker",
    "apps/tenant-router",
    "crates/audit-domain",
    "crates/auth-context",
    "crates/cell-application",
    "crates/cell-migrations",
    "crates/cell-postgres",
    "crates/platform-application",
    "crates/platform-migrations",
    "crates/platform-postgres",
    "crates/postgres-runtime",
    "crates/process-lifecycle",
    "crates/provisioning-domain",
    "crates/routing-application",
    "crates/runtime-config",
    "crates/secret-resolution",
    "crates/tenancy-domain",
    "crates/test-support",
    "tools/postgres-qualification",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
anyhow = { version = "=1.0.104", default-features = false, features = ["std"] }
clap = { version = "=4.6.4", default-features = false, features = ["derive", "std"] }
config = { version = "=0.15.25", default-features = false, features = ["toml"] }
getrandom = { version = "=0.4.3", default-features = false }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
secrecy = { version = "=0.10.3", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid", "migrate", "macros"] }
tempfile = { version = "=3.27.0", default-features = false }
thiserror = { version = "=2.0.19", default-features = false, features = ["std"] }
tokio = { version = "=1.51.4", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }
tracing = { version = "=0.1.44", default-features = false, features = ["attributes", "std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "json", "registry", "std"] }
uuid = { version = "=1.24.0", default-features = false, features = ["std"] }

audit-domain = { path = "crates/audit-domain", version = "=0.1.0" }
auth-context = { path = "crates/auth-context", version = "=0.1.0" }
cell-application = { path = "crates/cell-application", version = "=0.1.0" }
cell-migrations = { path = "crates/cell-migrations", version = "=0.1.0" }
cell-postgres = { path = "crates/cell-postgres", version = "=0.1.0" }
platform-application = { path = "crates/platform-application", version = "=0.1.0" }
platform-migrations = { path = "crates/platform-migrations", version = "=0.1.0" }
platform-postgres = { path = "crates/platform-postgres", version = "=0.1.0" }
postgres-runtime = { path = "crates/postgres-runtime", version = "=0.1.0" }
process-lifecycle = { path = "crates/process-lifecycle", version = "=0.1.0" }
provisioning-domain = { path = "crates/provisioning-domain", version = "=0.1.0" }
routing-application = { path = "crates/routing-application", version = "=0.1.0" }
runtime-config = { path = "crates/runtime-config", version = "=0.1.0" }
secret-resolution = { path = "crates/secret-resolution", version = "=0.1.0" }
tenancy-domain = { path = "crates/tenancy-domain", version = "=0.1.0" }
test-support = { path = "crates/test-support", version = "=0.1.0" }

[workspace.lints.rust]
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
