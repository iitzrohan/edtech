name: ci

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    workspace:
        name: Verify workspace
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Check out repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Run service-free verification
              run: cargo xtask verify

    postgres:
        name: Verify PostgreSQL
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out repository
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
            - name: Run disposable PostgreSQL CI profile
              run: cargo xtask verify-postgres --profile ci
            - name: Confirm no generated credentials remain
              if: always()
              run: test ! -d target/local-postgres || test -z "$(find target/local-postgres -mindepth 1 -maxdepth 1 -print -quit)"
